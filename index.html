<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Mymw Falcon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#141c2e;--line:#243049;--gold:#ffc107;--txt:#e8edf7;--mut:#8b97b1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:56px;height:56px;border-radius:14px}
h1{margin:0;font-size:24px;color:var(--gold)}
.sub{color:var(--mut);font-size:13px}
textarea{width:100%;height:300px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px;font:15px/1.5 ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:isolate;text-align:left;resize:vertical;tab-size:2}
.row{display:flex;gap:10px;margin:12px 0}
button.b{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700}
.run{background:var(--gold);color:#111}.ghost{background:#2a3347;color:var(--txt)}
h3{font-size:14px;color:var(--mut);margin:16px 0 8px;font-weight:600}
#out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:140px;text-align:center}
#out h2{color:var(--gold);margin:6px 0 14px}
#out .lbl{font-size:22px;margin:10px 0}
#out button{margin:6px;padding:12px 20px;border:0;border-radius:10px;background:#2f6bff;color:#fff;font-size:16px;font-weight:600}
#log{background:#0006;border-radius:10px;padding:10px;margin-top:10px;text-align:left;font:13px ui-monospace,monospace;color:#9fe3a8;white-space:pre-wrap;display:none}
#err{background:#3a1218;color:#ff9aa8;border-radius:10px;padding:10px;margin-top:10px;font:13px ui-monospace,monospace;text-align:left;display:none}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><div><h1>Mymw Falcon</h1><div class="sub">A bracket-only language for building apps</div></div></header>
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
<div class="row"><button class="b run" id="run">▶ Run</button><button class="b ghost" id="reset">↺ Example</button></div>
<h3>Output</h3>
<div id="out"></div>
<div id="log"></div><div id="err"></div>
<script>
// Mymw Falcon v0.1 - brackets-only language, English keywords.
class FalconError extends Error {
  constructor(msg, line, col) { super(`Line ${line}:${col} - ${msg}`); this.line = line; this.col = col; }
}

// ---------- 1) LEXER ----------
function lex(src) {
  const toks = []; let i = 0, line = 1, col = 1;
  const adv = () => { if (src[i] === '\n') { line++; col = 1; } else col++; i++; };
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { adv(); continue; }
    if (c === ';') { while (i < src.length && src[i] !== '\n') adv(); continue; }
    const L = line, C = col;
    if (c === '(' || c === ')') { toks.push({ t: c, line: L, col: C }); adv(); continue; }
    if (c === '"') {
      adv(); let s = '';
      while (i < src.length && src[i] !== '"') {
        if (src[i] === '\\') { adv(); const e = src[i]; s += e === 'n' ? '\n' : e === 't' ? '\t' : e; adv(); }
        else { s += src[i]; adv(); }
      }
      if (i >= src.length) throw new FalconError('String is not closed', L, C);
      adv(); toks.push({ t: 'str', v: s, line: L, col: C }); continue;
    }
    let w = '';
    while (i < src.length && !/[\s()";]/.test(src[i])) { w += src[i]; adv(); }
    if (/^-?\d+(\.\d+)?$/.test(w)) toks.push({ t: 'num', v: parseFloat(w), line: L, col: C });
    else toks.push({ t: 'sym', v: w, line: L, col: C });
  }
  return toks;
}

// ---------- 2) PARSER ----------
function parse(toks) {
  let p = 0;
  function node() {
    const k = toks[p++];
    if (k.t === '(') {
      const list = []; list.line = k.line; list.col = k.col;
      while (p < toks.length && toks[p].t !== ')') list.push(node());
      if (p >= toks.length) throw new FalconError("Missing ')'", k.line, k.col);
      p++; return list;
    }
    if (k.t === ')') throw new FalconError("Unexpected ')'", k.line, k.col);
    return { type: k.t, v: k.v, line: k.line, col: k.col };
  }
  const prog = [];
  while (p < toks.length) prog.push(node());
  return prog;
}

// ---------- 3) INTERPRETER ----------
class Env {
  constructor(parent) { this.vars = new Map(); this.parent = parent; }
  find(n) { for (let e = this; e; e = e.parent) if (e.vars.has(n)) return e; return null; }
  get(n, at) { const e = this.find(n); if (!e) throw new FalconError(`Unknown name '${n}'`, at.line, at.col); return e.vars.get(n); }
  set(n, v, at) { const e = this.find(n); if (!e) throw new FalconError(`'${n}' is not defined. Use (var ${n} ...) first`, at.line, at.col); e.vars.set(n, v); }
  def(n, v) { this.vars.set(n, v); }
}

function run(src, host = {}) {
  const out = host.print || console.log;
  const ui = host.ui || { title() {}, label() {}, button() {}, text() {} };
  const g = new Env();
  const err = (m, n) => { throw new FalconError(m, n.line, n.col); };
  const body = (nodes, env) => { let r; for (const n of nodes) r = ev(n, env); return r; };
  const math = {
    '+': (a, b) => (typeof a === 'string' || typeof b === 'string') ? '' + a + b : a + b,
    '-': (a, b) => a - b, '*': (a, b) => a * b, '/': (a, b) => a / b, '%': (a, b) => a % b,
    '=': (a, b) => a === b, '!=': (a, b) => a !== b, '<': (a, b) => a < b, '>': (a, b) => a > b,
    '<=': (a, b) => a <= b, '>=': (a, b) => a >= b,
  };
  function ev(n, env) {
    if (!Array.isArray(n)) {
      if (n.type === 'num' || n.type === 'str') return n.v;
      if (n.v === 'true') return true; if (n.v === 'false') return false;
      return env.get(n.v, n);
    }
    if (!n.length) return null;
    const h = n[0]; if (Array.isArray(h) || h.type !== 'sym') err('A command must start with a name', n);
    const a = n.slice(1), name = h.v;
    switch (name) {
      case 'var': env.def(a[0].v, a[1] ? ev(a[1], env) : null); return;
      case 'set': env.set(a[0].v, ev(a[1], env), a[0]); return;
      case 'print': out(a.map(x => ev(x, env)).join(' ')); return;
      case 'if': return ev(a[0], env) ? ev(a[1], env) : (a[2] ? ev(a[2], env) : null);
      case 'do': return body(a, new Env(env));
      case 'loop': { const c = ev(a[0], env); for (let k = 0; k < c; k++) body(a.slice(1), new Env(env)); return; }
      case 'while': { let guard = 0; while (ev(a[0], env)) { if (++guard > 1e6) err('Loop too long', n); body(a.slice(1), new Env(env)); } return; }
      case 'and': return a.every(x => ev(x, env));
      case 'or': return a.some(x => ev(x, env));
      case 'not': return !ev(a[0], env);
      case 'task': { // (task name (params) body...)
        const params = a[1].map(x => x.v), code = a.slice(2);
        env.def(a[0].v, { task: true, call: args => { const e = new Env(env); params.forEach((p, k) => e.def(p, args[k])); return body(code, e); } });
        return;
      }
      case 'title': ui.title(ev(a[0], env)); return;
      case 'label': { const id = a[0].v; ui.label(id, ev(a[1], env)); return; }
      case 'text': ui.text(a[0].v, ev(a[1], env)); return;
      case 'button': ui.button(ev(a[0], env), () => body(a.slice(1), new Env(env))); return;
    }
    if (math[name]) return a.map(x => ev(x, env)).reduce(math[name]);
    const f = env.find(name) && env.get(name, h);
    if (f && f.task) return f.call(a.map(x => ev(x, env)));
    err(`Unknown command '${name}'`, h);
  }
  body(parse(lex(src)), g);
}

if (false && typeof module !== 'undefined') module.exports = { lex, parse, run, FalconError };

</script>
<script>
const EXAMPLE=`; Mymw Falcon - counter app
(title "Counter App")
(var count 0)
(label total "Count: 0")

(task bump ()
  (set count (+ count 1))
  (text total (+ "Count: " count)))

(task clear ()
  (set count 0)
  (text total "Count: 0"))

(button "+ Add" (bump))
(button "Reset" (clear))

(print "Factorial of 5 is" (do (task fact (n) (if (<= n 1) 1 (* n (fact (- n 1))))) (fact 5)))
`;
const $=id=>document.getElementById(id);
const code=$('code');
try{code.value=localStorage.getItem('falcon_code')||EXAMPLE}catch(e){code.value=EXAMPLE}
function go(){
  const out=$('out'),log=$('log'),err=$('err');
  out.innerHTML='';log.style.display=err.style.display='none';log.textContent='';
  try{localStorage.setItem('falcon_code',code.value)}catch(e){}
  const labels={};
  const ui={
    title(t){const h=document.createElement('h2');h.textContent=t;out.appendChild(h)},
    label(id,t){const d=document.createElement('div');d.className='lbl';d.textContent=t;labels[id]=d;out.appendChild(d)},
    text(id,t){if(labels[id])labels[id].textContent=t},
    button(t,fn){const b=document.createElement('button');b.textContent=t;
      b.onclick=()=>{try{fn()}catch(e){showErr(e)}};out.appendChild(b)}
  };
  function showErr(e){err.textContent=e.message;err.style.display='block'}
  try{run(code.value,{ui,print:s=>{log.style.display='block';log.textContent+=s+'\n'}})}catch(e){showErr(e)}
}
$('run').onclick=go;
$('reset').onclick=()=>{code.value=EXAMPLE;go()};
go();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
